name: Testing
on:
  push:
    branches: main
    paths-ignore:
      - '.github/workflows/clang-formatter.yml'
      - 'project/discord-rpc/.clang-format'
      - 'LICENSE'
      - 'README.md'
      - 'haxelib.json'
      - 'hxformat.json'
  workflow_dispatch:
jobs:
  Desktop:
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Dependencies
        run: |
          haxelib install hxcpp --quiet
          haxelib dev hxdiscord_rpc .

      - name: Build Unix
        if: startsWith(matrix.os, 'macos') || startsWith(matrix.os, 'ubuntu')
        run: cd sample && haxe build-unix.hxml

      - name: Build Windows
        if: startsWith(matrix.os, 'windows')
        run: cd sample && haxe build-win.hxml

      - name: Build Scriptable
        run: cd sample && haxe build-scriptable.hxml

  Android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@main
        with:
          ndk-version: r21e

      - name: Install Dependencies
        run: |
          haxelib install hxcpp --quiet
          haxelib dev hxdiscord_rpc .

      - name: Build Android
        env:
          ANDROID_NDK_ROOT: ${{steps.setup-ndk.outputs.ndk-path}}
        run: cd sample && haxe build-android.hxml

  iOS:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
        with:
          submodules: true

      - name: Setup Haxe
        uses: krdlab/setup-haxe@master
        with:
          haxe-version: 4.3.7

      - name: Install Dependencies
        run: |
          haxelib install hxcpp --quiet
          haxelib dev hxdiscord_rpc .

      - name: Build iOS
        run: cd sample && haxe build-ios.hxml
